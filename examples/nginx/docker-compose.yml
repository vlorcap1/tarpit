# Demo: nginx in front of a sample app, with Telaraña deciding via auth_request.
#   export TELARANA_SECRET=$(openssl rand -hex 32)
#   docker compose up --build        ->  http://localhost:8080
services:
  telarana:
    build: ../..
    # or, once released: image: ghcr.io/vlorcap1/telarana:1
    environment:
      TELARANA_SECRET: ${TELARANA_SECRET:?set TELARANA_SECRET, e.g. openssl rand -hex 32}
      TELARANA_MODE: ${TELARANA_MODE:-observe}
      TELARANA_ROBOTS_FILE: /etc/telarana/robots.txt
    volumes:
      - ../robots.txt:/etc/telarana/robots.txt:ro

  app: # stand-in for your site; it echoes the request headers it receives
    image: traefik/whoami:v1.10.3

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./telarana_headers:/etc/nginx/telarana_headers:ro
    depends_on: [telarana, app]
