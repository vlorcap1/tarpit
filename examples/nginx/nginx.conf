# nginx + Telaraña via auth_request (ngx_http_auth_request_module, included in
# the official nginx images and most distribution packages).
worker_processes auto;
events { worker_connections 4096; }

http {
    upstream telarana { server telarana:8080; keepalive 16; }
    upstream app      { server app:80; }

    # Record the verdict next to every request: useful in observe mode.
    log_format telarana '$remote_addr "$request" $status verdict=$telarana_verdict '
                        'score=$telarana_score "$http_user_agent"';
    access_log /dev/stdout telarana;

    server {
        listen 80;

        # Telaraña serves robots.txt (your rules + per-visitor trap paths)
        # and the trap area itself.
        location = /robots.txt  { proxy_pass http://telarana; include /etc/nginx/telarana_headers; }
        location = /restricted  { proxy_pass http://telarana; include /etc/nginx/telarana_headers; }
        location ^~ /restricted/ { proxy_pass http://telarana; include /etc/nginx/telarana_headers; }

        # Every other request is checked first.
        location = /_telarana/check {
            internal;
            proxy_pass http://telarana/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
        }

        location / {
            auth_request /_telarana/check;
            auth_request_set $telarana_verdict $upstream_http_x_telarana_verdict;
            auth_request_set $telarana_score   $upstream_http_x_telarana_score;

            # Fail open: if Telaraña is down or slow, serve the site anyway.
            error_page 500 502 503 504 = @failopen;

            proxy_set_header X-Telarana-Verdict $telarana_verdict;
            proxy_set_header X-Telarana-Score   $telarana_score;
            proxy_set_header X-Forwarded-For    $remote_addr;
            proxy_pass http://app;
        }

        location @failopen {
            proxy_set_header X-Telarana-Verdict "unavailable";
            proxy_set_header X-Forwarded-For    $remote_addr;
            proxy_pass http://app;
        }
    }
}
