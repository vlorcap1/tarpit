name: Feature request
description: Suggest an idea or an integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: false-positives
    attributes:
      label: Could this ever flag a human or a legitimate crawler? How is that prevented?
