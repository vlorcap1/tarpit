events {}

http {
    # El tarpit decide por IP; el proxy DEBE pasar la IP real del cliente.
    server {
        listen 80;

        location / {
            proxy_pass http://tarpit:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;   # IP real -> clasificador
            proxy_set_header X-Real-IP $remote_addr;

            # Imprescindible para el goteo del tarpit: no almacenar en búfer,
            # dejar que las respuestas lentas fluyan tal cual.
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
    }
}
