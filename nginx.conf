events {
    # Cada visitante usa 2 conexiones (cliente + tarpit). El tarpit limita sus
    # respuestas a goteo (TARPIT_MAX_CONNS en config.py) muy por debajo de esto,
    # para que retener bots nunca deje sin conexiones a los visitantes reales.
    worker_connections 4096;
}

http {
    # El tarpit decide por IP; el proxy DEBE pasar la IP real del cliente.
    server {
        listen 80;

        location / {
            proxy_pass http://tarpit:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;   # IP real -> clasificador
            proxy_set_header X-Real-IP $remote_addr;

            # Imprescindible para el goteo del tarpit: no almacenar en búfer,
            # dejar que las respuestas lentas fluyan tal cual.
            proxy_buffering off;
            # Algo más que TARPIT_MAX_SECONDS (60 s en config.py). Si subes uno,
            # sube el otro.
            proxy_read_timeout 90s;
        }
    }
}
